# Publishes the server image to ghcr.io for amd64 and arm64 (Raspberry Pi, Apple silicon, ARM NAS).
# Runs on a tag `server-vX.Y.Z` or by hand; the image tag is the version only (no `latest` while pre-release).
name: server-image

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag (for example 0.2.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Version
        id: v
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#server-v}"; else v="${{ github.event.inputs.version }}"; fi
          grep -q "SERVER_VERSION = \"$v\"" packages/server/src/server-core.ts || { echo "SERVER_VERSION is not $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: npm test -- packages/server packages/protocol
      - run: node scripts/build.mjs server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/shuttle-server:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
