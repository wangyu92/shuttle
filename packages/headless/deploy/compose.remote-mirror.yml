# A second mirror on another host that reaches the server over HTTPS (design §6.1.11, remote mirror).
# Placeholders: /path/to/..., uid:gid. No autocommit sidecar here (two pushers to one repo conflict).
services:
  shuttle-mirror:
    image: shuttle-headless:0.1.0
    container_name: shuttle-mirror
    restart: unless-stopped
    user: "1000:1000"
    environment: { SHUTTLE_PROD: "1", NODE_OPTIONS: --max-old-space-size=320, TZ: UTC }
    volumes:
      - /path/to/data:/data
      - /path/to/shuttle-state:/state
    mem_limit: 512m
    ulimits: { core: 0 }
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    healthcheck: { test: ["CMD", "shuttle-headless", "status", "--quiet", "--state", "/state"], interval: 60s, timeout: 10s, retries: 3, start_period: 300s }
    stop_grace_period: 20s
